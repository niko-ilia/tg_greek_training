[project]
name = "greek-trainer"
version = "0.1.0"
description = "Personal Telegram bot for learning Greek vocabulary with FSRS spaced repetition"
requires-python = ">=3.12"

[tool.ruff]
# See .claude/rules/code-style-python.md for the rationale behind these choices.
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
# Line length is enforced by `ruff format`; long string literals it cannot break are fine.
ignore = ["E501"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek_trainer"]
