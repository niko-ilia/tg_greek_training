# Local development database only; in production Postgres is a Coolify resource.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: greek
      POSTGRES_PASSWORD: greek
      POSTGRES_DB: greek_trainer
    ports:
      - "127.0.0.1:5447:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro

volumes:
  pgdata:
